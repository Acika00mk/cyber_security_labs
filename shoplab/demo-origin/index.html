<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Another website (demo on localhost:4000)</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; background: #fff8e6; color: #3b3000; }
      button { font: inherit; padding: 0.6rem 1rem; border-radius: 6px; border: 1px solid #b38f00; background: #ffd24d; cursor: pointer; }
      pre { background: #fff; border: 1px solid #e0cf99; border-radius: 6px; padding: 1rem; white-space: pre-wrap; min-height: 3rem; }
    </style>
  </head>
  <body>
    <h1>Another website (demo on localhost:4000)</h1>
    <p>This page is served from a different origin than ShopLab. It only reads data; it never changes anything.</p>
    <button id="read">Read /api/auth/me from ShopLab</button>
    <pre id="result">Click the button.</pre>

    <script>
      const result = document.getElementById('result');
      document.getElementById('read').addEventListener('click', async () => {
        result.textContent = 'Sending request…';
        try {
          const res = await fetch('http://localhost:3000/api/auth/me', { credentials: 'include' });
          const body = await res.json();
          result.textContent = `HTTP ${res.status}\n` + JSON.stringify(body, null, 2);
        } catch (err) {
          result.textContent =
            'Blocked by the browser: the response is not readable from this origin. Check the console.\n\n' +
            `(${err.message})`;
        }
      });
    </script>
  </body>
</html>
